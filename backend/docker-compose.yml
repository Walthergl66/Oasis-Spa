services:
  postgres:
    image: postgres:16-alpine
    container_name: oasis_spa_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-oasis_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-oasis_secret}
      POSTGRES_DB: ${DB_DATABASE:-oasis_spa_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - oasis_postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-oasis_admin} -d ${DB_DATABASE:-oasis_spa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  oasis_postgres_data:
    name: oasis_postgres_data
